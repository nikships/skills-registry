name: Release

# Auto-cuts a patch release on every push to main that touches the Go CLI.
# Use the workflow_dispatch input to force a minor or major bump.
on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "install.sh"
      - "install.ps1"
      - "npm/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    name: Tests (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: cli/go.sum
      - name: Install Go analyzers
        # Pinned for reproducibility; bump intentionally with a separate PR.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          go install golang.org/x/tools/cmd/deadcode@v0.45.0
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
      - working-directory: cli
        run: |
          go vet ./...
          staticcheck ./...
          deadcode -test ./...
          gocyclo -over 15 -ignore "_test" .
          go test ./...

  tag:
    name: Tag release
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - id: tag
        env:
          BUMP_KIND: ${{ github.event.inputs.bump || 'patch' }}
        run: |
          set -euo pipefail

          latest=""
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest="$candidate"
              break
            fi
          done < <(git tag --list "v*" --sort=-v:refname)

          if [ -z "$latest" ]; then
            current="0.0.0"
          else
            current="${latest#v}"
          fi

          IFS=. read -r major minor patch <<<"$current"
          case "$BUMP_KIND" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch|*) patch=$((patch+1)) ;;
          esac

          next="$major.$minor.$patch"
          tag="v$next"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi

          echo "Tagging $tag from latest release $current ($BUMP_KIND)"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"

          sha="$(git rev-parse "${tag}^{commit}")"
          {
            echo "version=$next"
            echo "tag=$tag"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  build-cli:
    name: Build skills-registry ${{ matrix.os }}/${{ matrix.arch }}
    needs: tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: amd64
            runner: [self-hosted, mac-mini]
          - os: darwin
            arch: arm64
            runner: [self-hosted, mac-mini]
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
          - os: windows
            arch: amd64
            runner: ubuntu-latest
          - os: windows
            arch: arm64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: cli/go.sum
      - name: Remove stale isolated signing keychain
        if: matrix.os == 'darwin'
        run: |
          security delete-keychain "${{ runner.temp }}/skills-registry-signing.keychain" 2>/dev/null || true
      - name: Import certificate into isolated signing keychain
        if: matrix.os == 'darwin'
        uses: apple-actions/import-codesign-certs@v7
        with:
          keychain: ${{ runner.temp }}/skills-registry-signing
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
      - name: Select Xcode on NVMe
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="/Volumes/NVMe/Xcode.app"
          test -d "$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          echo "$XCODE_APP/Contents/Developer/usr/bin" >> "$GITHUB_PATH"
          xcodebuild -version
          CODESIGN_KEYCHAIN="${{ runner.temp }}/skills-registry-signing.keychain"
          security find-identity -v -p codesigning "$CODESIGN_KEYCHAIN"
          security find-identity -v -p codesigning "$CODESIGN_KEYCHAIN" \
            | grep -q "Developer ID Application"
      - name: Build
        working-directory: cli
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${{ needs.tag.outputs.version }}"
          out="skills-registry"
          if [ "$GOOS" = "windows" ]; then out="skills-registry.exe"; fi
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "dist/${out}" ./cmd/skills-registry
      - name: Sign and notarize (darwin)
        if: matrix.os == 'darwin'
        working-directory: cli/dist
        env:
          CODESIGN_KEYCHAIN: ${{ runner.temp }}/skills-registry-signing.keychain
          CODESIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          out="skills-registry"
          # Hardened-runtime + secure timestamp + Developer ID signature.
          # Required for notarization; replaces the previous ad-hoc sign
          # which couldn't bypass the com.apple.provenance kill path on
          # downloaded binaries.
          codesign --force \
            --options runtime \
            --timestamp \
            --keychain "$CODESIGN_KEYCHAIN" \
            --sign "$CODESIGN_IDENTITY" \
            "$out"
          codesign --verify --strict --verbose=2 --keychain "$CODESIGN_KEYCHAIN" "$out"
          # Notarize. notarytool wants a zip; --wait blocks until Apple
          # accepts or rejects. We cannot `stapler staple` a bare Mach-O
          # (only .app/.dmg/.pkg), but once the CDHash is in Apple's
          # ticket service, macOS performs a one-time online check on
          # first launch and caches the result.
          ditto -c -k --keepParent "$out" "${out}.notarize.zip"
          submit_output="$(/usr/bin/xcrun notarytool submit "${out}.notarize.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait --output-format json)"
          echo "$submit_output"
          status="$(printf '%s' "$submit_output" | /usr/bin/plutil -extract status raw -o - -)"
          if [ "$status" != "Accepted" ]; then
            submission_id="$(printf '%s' "$submit_output" | /usr/bin/plutil -extract id raw -o - -)"
            echo "::error::Notarization failed with status: $status"
            /usr/bin/xcrun notarytool log "$submission_id" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" || true
            exit 1
          fi
          rm "${out}.notarize.zip"
      - name: Restore login keychain search list
        if: ${{ always() && matrix.os == 'darwin' }}
        shell: bash
        run: |
          set -euo pipefail
          LOGIN_KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
          security list-keychains -d user -s "$LOGIN_KEYCHAIN"
          security default-keychain -d user -s "$LOGIN_KEYCHAIN"
      - name: Package archive
        working-directory: cli
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          out="skills-registry"
          if [ "$GOOS" = "windows" ]; then out="skills-registry.exe"; fi
          archive="skills-registry_${GOOS}_${GOARCH}"
          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip "${archive}.zip" "$out"
          else
            tar czf "${archive}.tar.gz" "$out"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            cli/dist/skills-registry_*.tar.gz
            cli/dist/skills-registry_*.zip
          if-no-files-found: ignore

  release:
    name: Create GitHub release
    needs: [tag, build-cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Create / update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.tag.outputs.tag }}"
          notes=$(printf '%s\n' \
            "Automated release for \`$tag\`." \
            "" \
            "* Go CLI binaries for darwin/amd64, darwin/arm64, linux/amd64, linux/arm64, windows/amd64, windows/arm64 are attached." \
            "" \
            "\`install.sh\` / \`install.ps1\` download the right CLI binary from the *latest* release; this is it.")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" --title "$tag" --notes "$notes" artifacts/*
          fi

  publish-npm:
    name: Publish npm wrapper
    # Runs after the release exists so the per-platform tarballs the wrapper
    # downloads (on postinstall / first run) are already attached. No-op when
    # the NPM_TOKEN secret is absent, so forks and token-less repos stay green.
    needs: [tag, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish skills-registry@${{ needs.tag.outputs.version }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PKG_VERSION: ${{ needs.tag.outputs.version }}
        working-directory: npm
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN not set — skipping npm publish."
            exit 0
          fi
          # Stamp the release version into package.json (kept at 0.0.0 in git).
          npm version "$PKG_VERSION" --no-git-tag-version --allow-same-version
          npm publish --provenance --access public

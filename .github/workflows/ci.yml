name: CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  cli:
    name: CLI (Go — build, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: cli/go.sum

      - run: go mod download
      - run: go vet ./...
      - name: Check gofmt formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
      - name: Run staticcheck (dead code + unused symbols)
        run: staticcheck ./...
      - name: Install deadcode
        # Pinned for reproducibility; bump intentionally with a separate PR.
        run: go install golang.org/x/tools/cmd/deadcode@v0.45.0
      - name: Run deadcode analyzer
        run: deadcode -test ./...
      - name: Install gocyclo
        # Pinned for reproducibility; bump intentionally with a separate PR.
        run: go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
      - name: Cyclomatic-complexity ceiling (gocyclo ≤15)
        # Industry-standard ceiling for Go production code. Test files are
        # excluded because table-driven tests naturally inflate complexity.
        run: gocyclo -over 15 -ignore "_test" .
      - run: go build ./...
      - run: go test ./...

  mac-app:
    name: macOS app (Swift — build + test)
    # This repository is public. Keep fork PR code off the self-hosted Mini.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mac-mini]
    defaults:
      run:
        working-directory: mac-app
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode on NVMe
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="/Volumes/NVMe/Xcode.app"
          test -d "$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          echo "$XCODE_APP/Contents/Developer/usr/bin" >> "$GITHUB_PATH"
          xcodebuild -version

      - name: Swift version
        run: swift --version

      - name: Build (arm64)
        run: swift build --arch arm64

      - name: Test (Core contract + cross-language corpus)
        run: swift test --arch arm64
